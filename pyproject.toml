[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dockwise"
version = "0.1.0"
description = "Research simulator for solar-charged mobile-robot delivery scheduling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.1,<2",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "pvlib>=0.11",
  "PyYAML>=6",
  "requests>=2.32",
  "sb3-contrib>=2.6,<3",
  "scipy>=1.13",
  "stable-baselines3>=2.6,<3",
  "torch>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dockwise = "dockwise.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

